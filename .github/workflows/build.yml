name: Build Aseprite

on:
  workflow_dispatch:
    inputs:
      aseprite_version:
        description: 'Aseprite version tag (e.g. v1.3.17). Leave empty for latest release'
        required: false
        default: ''
      create_release:
        description: 'Create GitHub Release'
        type: boolean
        required: false
        default: true

jobs:
  build:
    name: Build Windows (x64)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      ASE_VER_INPUT: ${{ github.event.inputs.aseprite_version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Long Paths
        run: git config --system core.longpaths true

      - name: Install Build Tools
        run: choco install ninja innosetup -y --no-progress

      - name: Resolve Aseprite Version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'User-Agent' = 'aseprite-builder' }
          if ($env:GH_TOKEN) { $headers['Authorization'] = "Bearer $env:GH_TOKEN" }

          if ($env:ASE_VER_INPUT) {
            $ver = $env:ASE_VER_INPUT.Trim()
          } else {
            $rel = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/aseprite/aseprite/releases/latest'
            $ver = $rel.tag_name
          }
          if (-not $ver) { throw 'Could not resolve Aseprite version' }

          "ASE_VER=$ver" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Aseprite version: $ver"

      - name: Download Aseprite Source
        run: |
          $ErrorActionPreference = 'Stop'
          # Release "Source.zip" already contains all submodules (laf, third_party, ...)
          $url = "https://github.com/aseprite/aseprite/releases/download/$env:ASE_VER/Aseprite-$env:ASE_VER-Source.zip"
          Write-Host "Downloading $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile aseprite_src.zip -UseBasicParsing
            New-Item -ItemType Directory -Force aseprite | Out-Null
            Expand-Archive -Force aseprite_src.zip aseprite
            # Flatten if the zip has a single top-level folder
            if (-not (Test-Path aseprite\CMakeLists.txt)) {
              $root = Get-ChildItem aseprite -Filter CMakeLists.txt -Recurse -Depth 1 | Select-Object -First 1
              Get-ChildItem "$($root.Directory.FullName)\*" -Force | Move-Item -Destination aseprite -Force
            }
          } catch {
            Write-Host "Source.zip not available ($_). Falling back to git clone --recursive"
            Remove-Item -Recurse -Force aseprite -ErrorAction SilentlyContinue
            git clone --recursive --depth 1 --branch $env:ASE_VER https://github.com/aseprite/aseprite.git aseprite
            if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }
          }
          if (-not (Test-Path aseprite\laf\CMakeLists.txt)) { throw 'laf submodule missing from source' }
          Write-Host 'Source ready'

      - name: Download Skia
        run: |
          $ErrorActionPreference = 'Stop'
          # Use the exact Skia build required by this Aseprite version
          $tagFile = 'aseprite\laf\misc\skia-tag.txt'
          if (Test-Path $tagFile) {
            $skiaTag = (Get-Content $tagFile -Raw).Trim()
          } else {
            $skiaTag = 'm124-08a5439a6b'
          }
          Write-Host "Skia tag: $skiaTag"
          $url = "https://github.com/aseprite/skia/releases/download/$skiaTag/Skia-Windows-Release-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile skia.zip -UseBasicParsing
          Expand-Archive -Force skia.zip skia

          if (-not (Test-Path 'skia\out\Release-x64\skia.lib')) { throw 'skia.lib not found' }
          if (-not (Test-Path 'skia\third_party\externals\icu\flutter\icudtl.dat')) {
            Write-Host '::warning::icudtl.dat not found in Skia package (older Skia?)'
          }
          Write-Host 'Skia ready'

      - name: Initialize MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake)
        run: |
          $src  = Join-Path $env:GITHUB_WORKSPACE 'aseprite'
          $skia = Join-Path $env:GITHUB_WORKSPACE 'skia'
          $out  = Join-Path $env:GITHUB_WORKSPACE 'build'
          cmake -S "$src" -B "$out" -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="$skia" `
            -DSKIA_LIBRARY_DIR="$skia\out\Release-x64" `
            -DSKIA_LIBRARY="$skia\out\Release-x64\skia.lib" `
            -DENABLE_UPDATER=OFF `
            -DENABLE_TESTS=OFF
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed ($LASTEXITCODE)" }

      - name: Compile (Ninja)
        run: |
          $jobs = [Environment]::ProcessorCount
          Write-Host "Using $jobs parallel jobs"
          cmake --build build --config RelWithDebInfo -- -j $jobs
          if ($LASTEXITCODE -ne 0) { throw "Build failed ($LASTEXITCODE)" }
          if (-not (Test-Path build\bin\aseprite.exe)) { throw 'aseprite.exe not produced' }

      - name: Prepare Package
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'build\bin'
          New-Item -ItemType Directory -Force package | Out-Null
          # Ship runtime files only (skip debug symbols / link artifacts / build tools)
          $exclude = @('*.pdb', '*.ilk', '*.exp', '*.lib', 'gen.exe')
          Copy-Item "$bin\*" package\ -Recurse -Exclude $exclude
          Get-ChildItem package

      - name: Create Portable ZIP
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = 'portable'
          Copy-Item package $portable -Recurse
          '# This file is here so Aseprite behaves as a portable program' |
            Out-File "$portable\aseprite.ini" -Encoding ascii
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$portable\*" -DestinationPath "dist\Aseprite-$env:ASE_VER-Windows-x64.zip"

      - name: Create Installer (Inno Setup)
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Join-Path $env:GITHUB_WORKSPACE 'package'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $iss = @"
          [Setup]
          AppName=Aseprite
          AppVersion=$env:ASE_VER
          DefaultDirName={autopf}\Aseprite
          DefaultGroupName=Aseprite
          UninstallDisplayIcon={app}\aseprite.exe
          OutputBaseFilename=Aseprite-$env:ASE_VER-Windows-x64-Setup
          OutputDir=$dist
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          Compression=lzma2
          SolidCompression=yes

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "$pkg\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Aseprite"; Filename: "{app}\aseprite.exe"
          Name: "{autodesktop}\Aseprite"; Filename: "{app}\aseprite.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\aseprite.exe"; Description: "{cm:LaunchProgram,Aseprite}"; Flags: nowait postinstall skipifsilent
          "@
          $iss | Out-File aseprite.iss -Encoding utf8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" aseprite.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          Get-ChildItem dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ env.ASE_VER }}-Windows-x64
          path: dist/*

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ASE_VER }}
          name: Aseprite ${{ env.ASE_VER }}
          body: |
            Aseprite ${{ env.ASE_VER }} - Windows x64 build

            - `Aseprite-${{ env.ASE_VER }}-Windows-x64.zip` : portable
            - `Aseprite-${{ env.ASE_VER }}-Windows-x64-Setup.exe` : installer

            **Note:** These builds are for personal use only. Please support the developers by purchasing Aseprite at https://www.aseprite.org/
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
